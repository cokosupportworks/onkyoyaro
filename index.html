<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音響野郎</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  
  <link rel="icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <img src="onkyologo.png" alt="音響野郎" class="logo">
        <span class="version-badge">v42</span>
      </div>
      <div class="toolbar">
        <button id="helpToggle" data-help="このボタンを押すとヘルプモードになり、各機能の説明を見ることができます。もう一度押すと解除されます。">❔ ヘルプ表示: OFF</button>
        <div class="dropdown" data-help="音声ファイルやフォルダを追加するためのメニューです。">
          <button class="dropbtn">音声追加 ▼</button>
          <div class="dropdown-content">
            <label class="file-button">
              <button type="button" id="pickFiles">音声ファイルを追加</button>
              <input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac" multiple>
            </label>
            <label class="file-button">
              <button type="button" id="pickFolder">フォルダ内の音声をすべて追加</button>
              <input id="folderInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac" webkitdirectory multiple>
            </label>
          </div>
        </div>
        <div class="dropdown" data-help="現在のリストの保存や、別のリストの読み込みを行うメニューです。">
          <button class="dropbtn">リスト保存・読込 ▼</button>
          <div class="dropdown-content">
            <button id="exportList">リスト情報のみを保存</button>
            <button id="exportPackage">リスト情報と音声データをまとめて保存</button>
            <label class="file-button">
              <button type="button" id="importButton">別のリストを読み込む</button>
              <input id="importInput" type="file" accept=".json,.zip,.sdpkg,application/json,application/zip">
            </label>
          </div>
        </div>
        <button id="safetyLock" data-help="本番ロックをONにすると、誤って音声を削除したり並べ替えたりするのを防ぎます。">本番ロック: OFF</button>
        <button id="clearAll" class="danger" data-help="現在読み込まれているすべての音声とリスト情報を消去します。">全消去</button>
      </div>
    </header>

    <main class="main">
      <section class="deck" aria-label="再生デッキ">
        <div class="now">
          <div class="label">Now Playing</div>
          <div id="nowTitle" class="track-title" data-help="現在再生中の音声の名前が表示されます。">音声を選択してください</div>
          <div class="meters">
            <div class="bar"><div id="progress" class="fill" data-help="再生の進行状況を示します。クリックするとその位置にジャンプ（シーク）します。"></div></div>
            <div class="time-row">
              <span id="currentTime">00:00.0</span>
              <span id="duration">00:00.0</span>
            </div>
          </div>
          <div class="control-row">
            <button id="playPause" class="play" data-help="選択している音声を再生、または一時停止します。">再生</button>
            <button id="stopInstant" class="stop-now" data-help="再生中のすべての音声を即座に停止します。">即座に停止</button>
            <button id="stopOne" class="stop-soft" data-help="再生中のすべての音声を1秒かけてフェードアウトして停止します。">1秒フェード停止</button>
            <button id="nextQueue" data-help="次に鳴らす音（キュー）を再生し、現在再生中の音をフェードアウトします。">次を再生</button>
          </div>
        </div>

        <div class="fader">
          <div class="label">Fade / Transition</div>
          <div class="fade-row">
            <input id="fadeSlider" type="range" min="0.2" max="15" step="0.1" value="3" data-help="任意フェード停止や曲の自動フェード接続時に使われるフェード時間を設定します。">
            <input id="fadeSeconds" type="number" min="0.2" max="60" step="0.1" value="3.0" data-help="任意フェード停止や曲の自動フェード接続時に使われるフェード時間を設定します。">
            <button id="stopCustom" class="stop-soft" data-help="横の設定した秒数をかけてフェードアウトして停止します。">任意フェード停止</button>
          </div>
          <div class="mini-grid">
            <label data-help="曲がフェード接続される際の動作モードを設定します。&#10;・即切替: 瞬時に次の曲へ切り替わります。&#10;・クロスフェード: 前の曲が消えゆくのと同時に次の曲が始まります。&#10;・フェード後に次を再生: 前の曲が完全に消えきってから次の曲が始まります。">切替モード
              <select id="transitionMode">
                <option value="instant">即切替</option>
                <option value="crossfade">クロスフェード</option>
                <option value="fadeThenPlay">フェード後に次を再生</option>
              </select>
            </label>
            <label data-help="クロスフェードの長さを設定します。">クロスフェード秒数
              <input id="crossfadeSeconds" type="number" min="0" max="30" step="0.1" value="2.0">
            </label>
          </div>
        </div>

        <div class="queue">
          <div class="label">Cue Queue</div>
          <div class="control-row">
            <select id="queueMode" data-help="リストから曲を連続で再生する際の動作モードを選びます。&#10;・手動スタンバイ: 自動再生しません。&#10;・曲終わりで自動再生: 曲が終わったらすぐ次の曲を再生します。&#10;・曲終わりでフェード接続: クロスフェードしながら次の曲を再生します。">
              <option value="manual">手動スタンバイ</option>
              <option value="auto">曲終わりで自動再生</option>
              <option value="fade">曲終わりでフェード接続</option>
            </select>
            <button id="clearQueue" class="edit-control" data-help="キュー（次に鳴らす音の順番）をすべて消去します。">キュー消去</button>
          </div>
          <div id="queueList" class="queue-list"></div>
        </div>

        <div class="fader">
          <div class="label" style="display: flex; justify-content: space-between; align-items: center;" data-help="システムホットキーは、どの音声を選択していてもキーボードのキー1つで停止機能などを呼び出せる便利なショートカット機能です。">
            <span>System Hotkeys</span>
            <button type="button" id="resetSystemHotkeys" style="font-size: 10px; padding: 2px 6px; background: transparent; border: 1px solid var(--line); color: var(--muted);" data-help="設定されているシステムホットキーをすべて消去して初期状態に戻します。">リセット</button>
          </div>
          <div class="mini-grid" style="grid-template-columns: repeat(3, 1fr); gap: 6px;">
            <button type="button" id="learnStopInstant" style="font-size: 11px; padding: 6px 4px;" title="即座に停止" data-help="「即時停止」を実行するキーボードのキーを登録します。押した後、好きなキーを押してください。">即時停止キー</button>
            <button type="button" id="learnStopSoft" style="font-size: 11px; padding: 6px 4px;" title="1秒フェード停止" data-help="「1秒停止」を実行するキーボードのキーを登録します。">1秒停止キー</button>
            <button type="button" id="learnStopCustom" style="font-size: 11px; padding: 6px 4px;" title="任意フェード停止" data-help="「任意停止」を実行するキーボードのキーを登録します。">任意フェードキー</button>
          </div>
          <div id="systemHotkeysStatus" class="status" style="font-size: 11px; margin-top: 4px; text-align: center;">即時: - / 1秒: - / 任意: -</div>
        </div>

        <div class="fader">
          <div class="label">MIDI Device</div>
          <div class="control-row">
            <button id="enableMidi">MIDI有効化</button>
          </div>
          <div id="midiStatus" class="status">MIDI未接続</div>
        </div>

        <div id="dropZone" class="drop-zone">
          音声ファイルをここへドラッグ&ドロップ
        </div>

        <div class="stat-row">
          <span id="trackCount" class="status">0 tracks</span>
          <span id="saveStatus" class="status">自動保存待機中</span>
          <span id="storageStatus" class="status"></span>
        </div>
      </section>

      <section class="library" aria-label="音声リスト">
        <div class="tabs">
          <button id="listTab" class="tab active" data-help="追加した音声がリスト表示されます。リストはドラッグ＆ドロップで並べ替えられます。">リスト</button>
          <button id="padTab" class="tab" data-help="音声をボタン（パッド）として並べて表示します。テレビ番組のポン出しのように、押した瞬間に音を鳴らせます。">ポン出し</button>
          <button id="editTab" class="tab" data-help="選択した音声の詳細な設定（音量、パン、開始秒、ループなど）を調整する画面です。">詳細編集</button>
        </div>
        <div class="library-head">
          <input id="search" class="search" type="search" placeholder="ファイル名 / タグ / ホットキーで検索" data-help="キーワードを入力すると、リストから一致する音声を絞り込んで表示します。">
          <span id="importStatus" class="status"></span>
        </div>
        <div class="view-container">
          <div id="trackList" class="track-list view active"></div>
          <div id="padGrid" class="pad-grid view"></div>
          <div id="inspector" class="inspector view"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="helpModal" class="help-modal">
    <div class="help-modal-content">
      <div class="help-modal-header">
        <h3 id="helpTitle">ヘルプ</h3>
        <button id="closeHelpModal" class="close-help">&times;</button>
      </div>
      <div class="help-modal-body">
        <p id="helpDescription"></p>
      </div>
    </div>
  </div>

  <script src="jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
